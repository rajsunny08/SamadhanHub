<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Log in to SamadhanHub to register problems and post solutions.">
<title>Login — SamadhanHub</title>
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/auth.css">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="images/icons/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="images/icons/icon-192.png">
<link rel="apple-touch-icon" href="images/icons/icon-180.png">
<meta name="theme-color" content="#0b1430">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="SamadhanHub">
<meta name="mobile-web-app-capable" content="yes">
</head>
<body>
<main class="auth-page">
  <div class="auth-card">
    <a class="brand" href="index.html">
      <img src="images/logo.jpeg" alt="SamadhanHub Logo">
      <span>SamadhanHub</span>
    </a>
    <h1>Welcome back</h1>
    <p>Sign in to manage your problems and solutions.</p>
    <form id="loginForm">
      <label>Email<input class="input" name="email" type="email" required autocomplete="email"></label>
      <label class="pw-toggle">Password<input class="input" name="password" type="password" required autocomplete="current-password"></label>
      <button class="btn btn-primary btn-large" type="submit">Login</button>
      <p id="authMessage" class="form-message"></p>
    </form>
    <p>New here? <a href="register.html">Create an account</a></p>
  </div>
</main>
<script src="js/icons.js"></script>
<script src="js/app.js"></script>
<script src="js/auth.js"></script>
<script src="js/site.js"></script>
<script src="js/chat.js"></script>
<script src="js/pwa.js"></script>
</body>
</html>
