<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Create Account — ProblemSolve</title><link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/auth.css"></head>
<body><main class="auth-page"><div class="auth-card"><a class="brand" href="index.html"><span>PS</span> ProblemSolve</a><h1>Create your account</h1><p>Join the community and start helping people.</p>
